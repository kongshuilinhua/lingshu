name: Lint & Test

on:
  push:
    branches: [master, new-version]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: lingshu_agent_test
          MYSQL_USER: lingshu
          MYSQL_PASSWORD: lingshu
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check api/ core/ tests/ --ignore=E501

      - name: Compile check
        run: python -m compileall api/ core/ -q

      # init_db 会创建 TRIGGER；mysql:8.0 默认开 binlog 且 lingshu 用户无 SUPER，
      # 否则 CREATE TRIGGER 会抛 errno 1419 导致用到 client fixture 的测试整体 setup 失败。
      - name: Allow trigger creation on CI MySQL
        run: mysql --protocol=tcp --host 127.0.0.1 --port 3306 -uroot -prootpassword -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Run tests
        env:
          # DATABASE_URL 必须显式指向 CI MySQL：否则 core.db.session 在模块导入时会用
          # config 默认值（192.168.150.101 内网 VM 库），CI 连不到导致大量测试 socket 超时挂死。
          DATABASE_URL: mysql+pymysql://lingshu:lingshu@127.0.0.1:3306/lingshu_agent_test
          TEST_DATABASE_URL: mysql+pymysql://lingshu:lingshu@127.0.0.1:3306/lingshu_agent_test
          LINGSHU_MOCK_LLM: "true"
          LINGSHU_VECTOR_BACKEND: "memory"
          JWT_SECRET: test-secret-do-not-use-in-production
        # 使用隔离的 MySQL service 跑完整套件，任何集成回归都会阻断合并。
        run: python -m pytest tests/ -v --timeout=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
