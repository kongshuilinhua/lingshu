# 静态资源 + /api 反向代理。
#
# 前端产物里不再写死后端地址：同源请求 /api/*，由这里转发到 api 容器。
# 部署时换域名、换端口都与镜像无关。

server {
    listen 5174;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS：upstream 用变量写法，nginx 在请求时才解析，
    # 避免 api 容器还没起来时 nginx 因 host not found 直接启动失败。
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 content hash 的产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE 必须关掉缓冲，否则 token 会被攒着一起发
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：对话流式响应可能持续数分钟
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 前端是 SPA：未知路径交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
